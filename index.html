<!DOCTYPE html>
<html lang="ru" id="root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кинорулетка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a080a; --panel:#141014; --panel2:#1c161b; --line:#2e2229; --line2:#3d2d37;
    --text:#f7e8ef; --muted:#9d8594; --accent:#ff3d8b; --accent-soft:rgba(255,61,139,.1); --accent-line:rgba(255,61,139,.4);
    --r-lg:24px; --r-md:14px; --r-sm:10px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;background:radial-gradient(900px 500px at 75% -10%, rgba(255,61,139,.14), transparent 60%),radial-gradient(700px 500px at 0% 100%, rgba(255,61,139,.06), transparent 60%),var(--bg)}
  button{font-family:inherit}
  .wrap{max-width:1120px;margin:0 auto;padding:28px 24px 56px}

  /* header */
  header{display:flex;align-items:center;gap:20px;margin-bottom:24px;flex-wrap:wrap}
  h1{font-family:Unbounded,sans-serif;font-weight:900;font-size:30px;line-height:1;margin:0;letter-spacing:-.02em;white-space:nowrap}
  h1 span{color:var(--accent)}
  #logo{cursor:pointer;user-select:none;-webkit-user-select:none;transition:opacity .15s}
  #logo:hover{opacity:.85}
  .tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{height:34px;padding:0 16px;background:none;border:0;border-radius:999px;color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;transition:color .15s,background .15s}
  .tabs button:hover{color:var(--text)}
  .tabs button.on{background:var(--accent);color:#0a080a}
  .lang{display:flex;gap:2px;margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
  .lang button{height:34px;padding:0 12px;background:none;border:0;border-radius:999px;color:var(--muted);font-weight:700;font-size:13px;letter-spacing:.06em;cursor:pointer}
  .lang button.on{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px var(--line2) inset}
  @media (max-width:720px){
    header{gap:14px}
    .tabs{order:3;width:100%}
    .tabs button{flex:1 0 auto}
  }

  /* shared */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px}
  .panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 16px}
  .panel-head h2{font-family:Unbounded,sans-serif;font-weight:700;font-size:18px;margin:0;letter-spacing:-.01em}
  .count{font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:var(--r-sm);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;transition:border-color .15s,filter .15s,background .15s}
  .btn:hover{border-color:var(--line2);background:#231b21}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#0a080a}
  .btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
  .btn.ghost{background:transparent}
  .btn.done{border-color:var(--accent-line);color:var(--accent)}
  a.link{color:var(--accent);font-size:13px;font-weight:700;text-decoration:none;border-bottom:1px solid var(--accent-line)}
  a.link:hover{border-color:var(--accent)}
  .label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 10px}

  /* wheel page */
  .grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);gap:24px;align-items:stretch}
  @media (max-width:880px){.grid{grid-template-columns:1fr}}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:36px 24px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .wheel-box{position:relative;width:min(100%,500px);aspect-ratio:1}
  canvas{width:100%;height:100%;display:block}
  .pointer{position:absolute;top:-10px;left:50%;width:40px;height:50px;transform:translateX(-50%);transform-origin:50% 12px;z-index:2;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
  .pointer.tick{animation:tick .12s ease-out}
  @keyframes tick{0%{transform:translateX(-50%) rotate(0)}40%{transform:translateX(-50%) rotate(-18deg)}100%{transform:translateX(-50%) rotate(0)}}
  .hub{position:absolute;inset:0;margin:auto;width:20%;height:20%;border-radius:50%;background:radial-gradient(circle at 35% 30%, #3a2a33, #120d11 70%);border:5px solid var(--bg);box-shadow:0 6px 20px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:clamp(22px,4vw,32px);cursor:pointer;user-select:none;transition:transform .15s}
  .hub:hover{transform:scale(1.06)}
  .hub:active{transform:scale(.96)}
  .spin-btn{margin-top:28px;height:56px;padding:0 40px;font-family:Unbounded,sans-serif;font-weight:700;font-size:17px;background:var(--accent);color:#0a080a;border:0;border-radius:999px;cursor:pointer;box-shadow:0 5px 0 #9e1352,0 12px 30px rgba(255,61,139,.22);transition:transform .08s,box-shadow .08s}
  .spin-btn:hover{filter:brightness(1.05)}
  .spin-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #9e1352}
  .spin-btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 5px 0 #9e1352}
  .hint{color:var(--muted);font-size:13px;margin-top:14px;text-align:center;min-height:18px}

  .side{display:flex;flex-direction:column}
  textarea{display:block;width:100%;min-height:88px;resize:vertical;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;font:inherit;font-size:15px;line-height:1.45;outline:none;transition:border-color .15s}
  textarea::placeholder{color:#6f5c68}
  textarea:focus{border-color:var(--accent-line)}
  .side .row{margin-top:10px}
  .opts{display:flex;align-items:center;gap:10px;margin-top:16px;color:var(--muted);font-size:14px;cursor:pointer;user-select:none}
  .opts input{appearance:none;-webkit-appearance:none;margin:0;flex:none;position:relative;cursor:pointer;width:36px;height:20px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);transition:background .2s,border-color .2s}
  .opts input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
  .opts input:checked{background:var(--accent-soft);border-color:var(--accent)}
  .opts input:checked::after{transform:translateX(16px);background:var(--accent)}
  .opts input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  ul{list-style:none;margin:16px 0 0;padding:0;max-height:320px;overflow:auto;border-top:1px solid var(--line)}
  li{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 4px;border-bottom:1px solid var(--line);font-size:15px}
  li .dot{width:10px;height:10px;border-radius:3px;flex:none;box-shadow:0 0 0 1px var(--accent-line)}
  li .name{flex:1;overflow-wrap:anywhere;padding:10px 0}
  li button{width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;background:none;border:0;border-radius:8px;color:var(--muted);font-size:18px;cursor:pointer;line-height:1}
  li button:hover{color:var(--accent);background:var(--panel2)}
  .empty{color:var(--muted);font-size:14px;padding:20px 4px;text-align:center;border-bottom:1px solid var(--line)}
  .history{margin-top:20px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--muted)}

  /* subpages */
  .page{max-width:760px;margin:0 auto;padding:28px}
  .page-sub{color:var(--muted);font-size:14px;margin:-8px 0 20px}

  /* quiz chat */
  .log{display:flex;flex-direction:column;gap:10px;min-height:260px}
  .msg{max-width:82%;padding:12px 16px;border-radius:18px;font-size:15px;line-height:1.45;animation:msgIn .25s ease-out;overflow-wrap:anywhere}
  @keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg.bot{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:6px}
  .msg.me{align-self:flex-end;background:var(--accent);color:#0a080a;font-weight:700;border-bottom-right-radius:6px}
  .msg.err{border-color:var(--accent-line)}
  .typing{display:inline-flex;gap:5px;align-items:center;height:18px;vertical-align:middle}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.4;animation:blink 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes blink{50%{opacity:1;transform:translateY(-3px)}}
  .controls{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}
  .controls:empty{display:none}
  .chipbtn{height:40px;padding:0 16px;background:transparent;color:var(--text);border:1px solid var(--line2);border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;transition:border-color .15s,background .15s}
  .chipbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
  .free{display:flex;gap:8px;width:100%}
  .free input{flex:1;min-width:0;height:40px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:0 16px;font:inherit;font-size:15px;outline:none}
  .free input:focus{border-color:var(--accent-line)}
  .progress{height:3px;background:var(--panel2);border-radius:3px;margin-bottom:20px;overflow:hidden}
  .progress b{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .recs{display:grid;gap:10px;width:100%}
  .rec{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:16px 18px;animation:msgIn .3s ease-out both}
  .rec h4{font-family:Unbounded,sans-serif;font-size:16px;margin:0 0 4px;line-height:1.3}
  .rec .meta{color:var(--muted);font-size:13px;margin-bottom:8px}
  .rec p{margin:0 0 12px;font-size:14px;line-height:1.5}
  .rec .acts{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .rec a{color:var(--accent);font-size:13px;font-weight:700;text-decoration:none;border-bottom:1px solid var(--accent-line)}
  .rec .add{margin-left:auto;height:34px;padding:0 12px;font-size:13px}

  /* lists */
  .cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media (max-width:640px){.cats{grid-template-columns:1fr}}
  .cat{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:16px;background:var(--panel2);border:1px solid var(--line);border-radius:18px;color:var(--text);cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
  .cat:hover{border-color:var(--line2)}
  .cat.on{border-color:var(--accent);background:var(--accent-soft)}
  .cat-badge{height:30px;min-width:30px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:var(--bg);border:1px solid var(--accent-line);color:var(--accent);font-family:Unbounded,sans-serif;font-weight:700;font-size:12px}
  .cat-text{display:flex;flex-direction:column;gap:4px}
  .cat-title{font-family:Unbounded,sans-serif;font-weight:700;font-size:14px;line-height:1.3}
  .cat-sub{color:var(--muted);font-size:13px;font-weight:600}
  .pick{margin-top:16px;padding:32px 24px 24px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(160deg,#211820,#110d10);text-align:center}
  .pick-rank{color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;min-height:16px}
  .pick-title{font-family:Unbounded,sans-serif;font-weight:900;font-size:clamp(22px,4.5vw,30px);line-height:1.2;margin:12px 0 6px;color:var(--accent);overflow-wrap:anywhere;min-height:1.2em}
  .pick-title.rolling{color:var(--text);opacity:.5}
  .pick-title.landed{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  .pick-orig{color:var(--muted);font-size:14px;margin-bottom:2px}
  .pick-orig:empty{display:none}
  .pick-year{color:var(--text);opacity:.75;font-size:15px;min-height:20px}
  .pick-acts{display:flex;gap:18px;justify-content:center;margin-top:16px}
  .pick-acts a,.src a{color:var(--accent);font-size:13px;font-weight:700;text-decoration:none;border-bottom:1px solid var(--accent-line)}
  .pick-btns{justify-content:center;margin-top:20px}
  .src{margin:16px 0 0;font-size:12px}
  .src a{color:var(--muted);border-color:var(--line2);font-size:12px}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(10,6,12,.75);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
  .modal.show{display:flex}
  .card{background:linear-gradient(160deg,#211820,#110d10);border:1px solid var(--line);border-radius:var(--r-lg);padding:36px 28px 28px;max-width:440px;width:100%;text-align:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .card .pre{color:var(--muted);font-size:14px;margin:0 0 12px}
  .card .film{font-family:Unbounded,sans-serif;font-weight:900;font-size:clamp(24px,5vw,32px);line-height:1.2;margin:0 0 12px;color:var(--accent);overflow-wrap:anywhere}
  .card .post{font-size:15px;margin:0 0 24px;opacity:.85;line-height:1.45}
  .card .row{justify-content:center}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:11}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-i18n-html="title" id="logo" role="button" tabindex="0">Кино<span>рулетка</span></h1>
    <nav class="tabs" id="tabs">
      <button data-tab="wheel" class="on" data-i18n="tabWheel">Колесо</button>
      <button data-tab="quiz" data-i18n="tabQuiz">Не знаю, что посмотреть</button>
      <button data-tab="lists" data-i18n="listsTitle">Списки фильмов</button>
    </nav>
    <div class="lang" id="lang"><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
  </header>

  <div class="grid" id="tab-wheel">
    <section class="stage">
      <div class="wheel-box">
        <svg class="pointer" id="pointer" viewBox="0 0 44 54"><path d="M22 52 L4 14 A18 18 0 1 1 40 14 Z" fill="#ff3d8b" stroke="#0a080a" stroke-width="3"/><circle cx="22" cy="14" r="6" fill="#0a080a"/></svg>
        <canvas id="wheel"></canvas>
        <div class="hub" id="hub" data-i18n-title="hubTitle" title="Крутить">🍿</div>
      </div>
      <button class="spin-btn" id="spin" data-i18n="spin">Крутить колесо</button>
      <div class="hint" id="hint"></div>
    </section>

    <section class="panel side">
      <div class="panel-head"><h2 data-i18n="listTitle">Что в списке</h2><span class="count" id="count"></span></div>
      <textarea id="input" data-i18n-ph="placeholder" placeholder="Дюна&#10;Паразиты&#10;Брат 2"></textarea>
      <div class="row">
        <button class="btn primary" id="add" data-i18n="add">Добавить</button>
        <button class="btn ghost" id="shuffle" data-i18n="shuffle">Перемешать</button>
        <button class="btn ghost" id="clear" data-i18n="clear">Очистить всё</button>
      </div>
      <label class="opts"><input type="checkbox" id="autoremove" checked> <span data-i18n="autoremove">Убирать выбранный фильм из колеса</span></label>
      <ul id="list"></ul>
      <div class="history" id="historyBox" hidden>
        <p class="label" data-i18n="history">Судьба уже выбирала</p>
        <div class="chips" id="history"></div>
      </div>
    </section>
  </div>

  <section id="tab-lists" hidden>
    <div class="panel page">
      <div class="panel-head"><h2 data-i18n="listsTitle">Списки фильмов</h2></div>
      <div class="cats">
        <button class="cat" data-list="rt">
          <span class="cat-badge">RT</span>
          <span class="cat-text"><span class="cat-title" data-i18n="rtTitle"></span><span class="cat-sub" data-i18n="rtSub"></span></span>
        </button>
        <button class="cat" data-list="imdb">
          <span class="cat-badge">IMDb</span>
          <span class="cat-text"><span class="cat-title" data-i18n="imdbTitle"></span><span class="cat-sub" data-i18n="imdbSub"></span></span>
        </button>
        <button class="cat" data-list="lb">
          <span class="cat-badge">LB</span>
          <span class="cat-text"><span class="cat-title" data-i18n="lbTitle"></span><span class="cat-sub" data-i18n="lbSub"></span></span>
        </button>
      </div>
      <div class="pick" id="pick" hidden>
        <div class="pick-rank" id="pickRank"></div>
        <div class="pick-title" id="pickTitle"></div>
        <div class="pick-orig" id="pickOrig"></div>
        <div class="pick-year" id="pickYear"></div>
        <div class="pick-acts" id="pickActs" hidden>
          <a id="pickKp" target="_blank" rel="noopener">Кинопоиск ↗</a>
          <a id="pickLb" target="_blank" rel="noopener">Letterboxd ↗</a>
        </div>
        <div class="row pick-btns" id="pickBtns" hidden>
          <button class="btn primary" id="pickAgain" data-i18n="pickAgain">Ещё фильм</button>
          <button class="btn" id="pickAdd"></button>
        </div>
        <p class="src" id="pickSrcWrap" hidden><a id="pickSrc" target="_blank" rel="noopener"></a></p>
      </div>
    </div>
  </section>

  <section id="tab-quiz" hidden>
    <div class="panel page">
      <div class="panel-head"><h2 data-i18n="tabQuiz">Не знаю, что посмотреть</h2></div>
      <div class="progress"><b id="prog"></b></div>
      <div class="log" id="log"></div>
      <div class="controls" id="controls"></div>
    </div>
  </section>
</div>

<div class="modal" id="modal">
  <div class="card">
    <p class="pre" id="pre">Судьба говорит:</p>
    <p class="film" id="film"></p>
    <p class="post" id="post"></p>
    <div class="row">
      <button class="btn primary" id="accept" data-i18n="accept">Смотрю!</button>
      <button class="btn" id="again" data-i18n="again">Не, крутим ещё</button>
    </div>
  </div>
</div>
<canvas class="confetti" id="confetti"></canvas>

<script>
(() => {
  // эмо-палитра: чёрные и розовые сектора по очереди, у каждого свой цвет текста
  const PALETTE = [
    {bg:'#120d11', fg:'#ff3d8b'},
    {bg:'#ff3d8b', fg:'#0a080a'},
    {bg:'#231a20', fg:'#ffb3d1'},
    {bg:'#b3195d', fg:'#fde6f0'},
  ];
  function segStyle(i,n){
    let k = i % PALETTE.length;
    if(n > 1 && i === n-1 && k === 0) k = 2; // чтобы последний не слипся с первым
    return PALETTE[k];
  }
  const COLORS = ['#ff3d8b','#ffffff','#b3195d','#ffb3d1','#231a20'];
  const I18N = {
    ru: {
      title:'Кино<span>рулетка</span>', docTitle:'Кинорулетка', hubTitle:'Крутить', remove:'Убрать', listsTitle:'Списки фильмов', listsSub:'Случайный фильм из великих топов →', imdbTitle:'IMDb Top 250', imdbSub:'Топ зрителей IMDb · 250 фильмов', kpTitle:'Топ-250 Кинопоиска', kpSub:'Архивный топ до 2021 года · 250 фильмов', lbTitle:'Letterboxd Top 250', lbSub:'Топ киноманов Letterboxd · 250 фильмов', srcLabel:'Источник списка ↗', listsHint:'Выбери список — и судьба вытащит из него фильм.', rtTitle:'Лучшие фильмы Rotten Tomatoes', rtSub:'Топ критиков всех времён · 299 фильмов', rtSource:'Источник: Rotten Tomatoes ↗', pickAgain:'Ещё фильм', place:n=>`№ ${n} в рейтинге`, quizSub:'Подберу фильм под настроение →', back:'← К колесу', tabWheel:'Колесо', tabQuiz:'Не знаю, что посмотреть',
      qHello:'Привет! Помогу выбрать фильм под настроение. Пара быстрых вопросов — и я что-нибудь подберу 🍿',

    const l = pickLabel(current), on = films.some(x=>x.toLowerCase()===l.toLowerCase());
    $('pickAdd').textContent = on ? T('inWheel') : T('toWheel');
    $('pickAdd').classList.toggle('done', on);
  }
  function showFilm(f){
    $('pickTitle').textContent = f[1];
    $('pickOrig').textContent = f[3] && f[3] !== f[1] ? f[3] : '';
    $('pickRank').textContent = T('place')(f[0]);
    $('pickYear').textContent = f[2];
  }
  function rollList(key){
    if(rolling) return; rolling = true; currentList = key;
    const items = LISTS[key].items;
    document.querySelectorAll('.cat').forEach(c=>c.classList.toggle('on', c.dataset.list===key));
    $('pick').hidden = false; $('pickActs').hidden = true; $('pickBtns').hidden = true; $('pickSrcWrap').hidden = true;
    const title = $('pickTitle');
    title.classList.remove('landed'); title.classList.add('rolling');
    $('pick').scrollIntoView({behavior:'smooth', block:'nearest'});
    let i; do { i = Math.floor(Math.random()*items.length); } while(items.length > 1 && i === lastPick[key]);
    lastPick[key] = i;
    const steps = 22; let k = 0;
    try{ getAudio(); audio.resume && audio.resume(); }catch(e){}
    (function tick(){
      if(k < steps){
        showFilm(items[Math.floor(Math.random()*items.length)]);
        if(k % 2 === 0) bell(SCALE[(k/2)%SCALE.length], 0.035, 0.6);
        k++; setTimeout(tick, 40 + k*k*0.55);
      } else {
        current = items[i]; showFilm(current);
        title.classList.remove('rolling'); void title.offsetWidth; title.classList.add('landed');
        $('pickKp').href = 'https://www.kinopoisk.ru/index.php?kp_query=' + encodeURIComponent(current[1]);
        $('pickLb').href = 'https://letterboxd.com/search/films/' + encodeURIComponent(current[3] || current[1]) + '/';
        $('pickSrc').href = LISTS[key].src; $('pickSrc').textContent = T('srcLabel');
        $('pickActs').hidden = false; $('pickBtns').hidden = false; $('pickSrcWrap').hidden = false; syncPickAdd();
        finalChime(); confetti();
        rolling = false;
      }
    })();
  }
  document.querySelectorAll('.cat').forEach(c=>c.onclick=()=>rollList(c.dataset.list));
  $('pickAgain').onclick = () => currentList && rollList(currentList);
  $('pickAdd').onclick = () => {
    if(!current) return;
    const l = pickLabel(current), idx = films.findIndex(x=>x.toLowerCase()===l.toLowerCase());
    if(idx>=0) films.splice(idx,1); else films.push(l);
    render(); syncPickAdd();
  };

  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
  $('logo').onclick = () => showTab('wheel');
  $('logo').onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); showTab('wheel'); } };

  // ===== Тест «Не знаю, что посмотреть» =====
  let samplerP = null;
  function getSampler(){
    if(!samplerP) samplerP = (window.claude && window.claude.use) ? window.claude.use('sample').catch(()=>null) : Promise.resolve(null);
    return samplerP;
  }
  let quizRun = 0;
  let quizStarted = false, step = 0, answers = {}, shown = [], busy = false;
  const log = () => $('log'), controls = () => $('controls');
  function scrollDown(){ const el = log().lastElementChild; if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'}); }
  function say(who, text, cls=''){
    const d = document.createElement('div'); d.className = `msg ${who} ${cls}`; d.textContent = text;
    log().appendChild(d); scrollDown(); return d;
  }
  function typing(){
    const d = document.createElement('div'); d.className='msg bot';
    d.innerHTML = '<span class="typing"><i></i><i></i><i></i></span> <span style="color:var(--muted);font-size:14px;margin-left:6px"></span>';
    d.lastElementChild.textContent = T('thinking');
    log().appendChild(d); scrollDown(); return d;
  }
  function setProgress(){ const Q=T('quiz'); $('prog').style.width = Math.min(100, step/Q.length*100)+'%'; }
  function startQuiz(){
    quizRun++; busy = false; quizStarted = true; step = 0; answers = {}; shown = [];
    log().innerHTML=''; controls().innerHTML='';
    say('bot', T('qHello'));
    setTimeout(ask, 350);
  }
  function ask(){
    setProgress();
    const Q = T('quiz');
    if(step >= Q.length){ recommend(); return; }
    const q = Q[step];
    say('bot', q.q);
    const c = controls(); c.innerHTML='';
    if(q.free){
      const wrap = document.createElement('form'); wrap.className='free';
      wrap.innerHTML = `<input type="text" maxlength="200"><button class="btn primary" type="submit"></button><button class="btn ghost" type="button"></button>`;
      const inp = wrap.querySelector('input'); inp.placeholder = T('freePh');
      const [send, skip] = wrap.querySelectorAll('button'); send.textContent = T('send'); skip.textContent = T('skip');
      wrap.onsubmit = e => { e.preventDefault(); const v = inp.value.trim(); answer(q, v || null, v || T('skip')); };
      skip.onclick = () => answer(q, null, T('skip'));
      c.appendChild(wrap); setTimeout(()=>inp.focus(), 50);
    } else {
      q.opts.forEach(o=>{
        const b = document.createElement('button'); b.className='chipbtn'; b.textContent=o;
        const idx = q.opts.indexOf(o);
        b.onclick = () => answer(q, idx, o); c.appendChild(b);
      });
    }
  }
  function answer(q, value, label){
    answers[q.key] = value; say('me', label); controls().innerHTML='';
    step++; setTimeout(ask, 300);
  }

  async function recommend(more=false){
    if(busy) return; busy = true; const run = quizRun;
    controls().innerHTML='';
    const dots = typing();
    const sample = await getSampler();
    if(run !== quizRun) return;
    if(!sample){ dots.remove(); say('bot', T('noClaude'), 'err'); busy=false; endButtons(false); return; }
    const isRu = lang === 'ru';
    const avoid = [...new Set([...shown, ...films, ...history])].slice(0, 80);
    const RULES = {
      mood: [
        'cozy, warm, feel-good, comforting; nothing dark or disturbing',
        'a comedy that is genuinely funny out loud; laughter is the main point',
        'a moving drama / tearjerker that will make the viewer cry, but in a cathartic way',
        'melancholic, beautifully sad, aesthetic and atmospheric (arthouse-leaning is fine); gloom is welcome',
        'mind-bending: twists, puzzles, unreliable reality, big ideas that leave the brain buzzing',
        'high adrenaline: thriller, action, suspense, tension from start to finish'
      ],
      company: [
        'watching alone — no restrictions',
        'watching as a couple — good for two people, works as a date movie',
        'watching with friends — fun to react to and discuss together',
        'watching with family incl. kids or parents — must be family-safe: no sex scenes, no gore, no heavy profanity (PG / PG-13 at most)'
      ],
      energy: [
        'HARD LIMIT: runtime 105 minutes or less, easy to follow, not demanding',
        'runtime 140 minutes or less, moderately engaging',
        'any runtime; slow, long, complex or demanding films are welcome'
      ],
      era: [
        'HARD LIMIT: released in 2021 or later',
        'HARD LIMIT: released between 2000 and 2020 inclusive',
        'HARD LIMIT: released before 2000',
        'any release year — mix eras'
      ],
      origin: [
        'HARD LIMIT: Russian or Soviet production only (USSR / Russia)',
        'HARD LIMIT: American (Hollywood or US independent) production only',
        'HARD LIMIT: European production only (incl. UK, France, Italy, Spain, Germany, Scandinavia, etc.); NOT US, NOT Russian/Soviet',
        'HARD LIMIT: Asian production only (Japan, South Korea, China, Hong Kong, Taiwan, India, Thailand, etc.)',
        'any country — ideally mix countries'
      ]
    };
    const r = k => RULES[k][answers[k]] || 'no preference';
    const prompt =
`You are a film curator with encyclopedic, accurate film knowledge. Pick exactly 5 real feature films (no TV series, no shorts) for this viewer.

REQUIREMENTS — every film must satisfy ALL of them:
1. Mood: ${r('mood')}
2. Company: ${r('company')}
3. Length / effort: ${r('energy')}
4. Era: ${r('era')}
5. Origin: ${r('origin')}
6. Viewer's own wish (highest priority if given): ${answers.wish ? '"' + answers.wish + '"' : 'none'}
7. Must NOT be any of these (already on the viewer's list or already suggested): ${avoid.length ? avoid.join('; ') : 'none'}
${more ? '8. The viewer asked for more: choose different, less obvious films than the excluded ones.' : '8. Mix 2–3 well-loved titles with 2–3 less obvious gems.'}

ACCURACY:
- Only films you are certain exist. Year = original release year, runtime = real runtime in minutes, director = the real director.
- Before answering, check each film against every requirement above (especially era, origin and runtime). If one fails, replace it.
- If the requirements are so strict that fewer than 5 films fit well, return fewer rather than breaking a requirement.

LANGUAGE: ${isRu
  ? 'Write "why" and "intro" in Russian: casual, warm, a little funny, address the viewer as «ты». "title" = the official Russian release title as on Kinopoisk (for Russian/Soviet films, the original title). If unsure of the Russian title, use the original title.'
  : 'Write "why" and "intro" in English: casual, warm, a little funny. "title" = the common English title.'}
"original" = original-language title (Latin transliteration not needed for Cyrillic). "country" = main production country${isRu ? ' in Russian' : ''}.
"why" = 1–2 short sentences on why it fits THIS mood and company. No spoilers.

Reply with ONLY this JSON, nothing else:
{"intro":"one short playful line","films":[{"title":"","original":"","year":1999,"director":"","country":"","runtime":100,"why":""}]}`;
    try{
      const res = await sample.json(prompt, {modelTier:'complex', cache:false});
      if(run !== quizRun) return;
      dots.remove();
      const list = (res && Array.isArray(res.films)) ? res.films.filter(f=>f && f.title) : [];
      if(!list.length) throw new Error('empty');
      list.forEach(f=>shown.push(f.title));
      say('bot', (res.intro ? res.intro + ' ' : '') + (more ? '' : T('recIntro')));
      showRecs(list);
      $('prog').style.width='100%';
      endButtons(true);
    }catch(e){
      if(run !== quizRun) return;
      dots.remove();
      if(e && e.code === 'not_granted'){ say('bot', T('noClaude'), 'err'); endButtons(false); }
      else if(e && e.code === 'rate_limited'){ say('bot', T('rate'), 'err'); endButtons(false); }
      else {
        say('bot', T('err'), 'err');
        const c = controls(); c.innerHTML='';
        const r = document.createElement('button'); r.className='btn primary'; r.textContent=T('retry'); r.onclick=()=>recommend(more); c.appendChild(r);
        const st = document.createElement('button'); st.className='btn ghost'; st.textContent=T('restart'); st.onclick=startQuiz; c.appendChild(st);
      }
    }
    busy = false;
  }

  let lastRecs = [];
  function filmLabel(f){ return f.year ? `${f.title} (${f.year})` : f.title; }
  function showRecs(list){
    lastRecs = list;
    const box = document.createElement('div'); box.className='recs';
    list.forEach((f,i)=>{
      const card = document.createElement('div'); card.className='rec'; card.style.animationDelay = (i*80)+'ms';
      const h = document.createElement('h4'); h.textContent = f.title; card.appendChild(h);
      const meta = document.createElement('div'); meta.className='meta';
      meta.textContent = [f.original && f.original !== f.title ? f.original : null, f.year, f.director, f.country, f.runtime ? `${f.runtime} ${T('min')}` : null].filter(Boolean).join(' · ');
      card.appendChild(meta);
      const p = document.createElement('p'); p.textContent = f.why || ''; card.appendChild(p);
      const acts = document.createElement('div'); acts.className='acts';
      const q = encodeURIComponent(f.title);
      const kp = document.createElement('a'); kp.href = 'https://www.kinopoisk.ru/index.php?kp_query=' + q; kp.target='_blank'; kp.rel='noopener'; kp.textContent='Кинопоиск ↗';
      const lb = document.createElement('a'); lb.href = 'https://letterboxd.com/search/films/' + encodeURIComponent(f.original || f.title) + '/'; lb.target='_blank'; lb.rel='noopener'; lb.textContent='Letterboxd ↗';
      const add = document.createElement('button'); add.className='btn add';
      const label = filmLabel(f);
      const sync = () => { const on = films.some(x=>x.toLowerCase()===label.toLowerCase()); add.textContent = on ? T('inWheel') : T('toWheel'); add.classList.toggle('done', on); };
      add.onclick = () => {
        const idx = films.findIndex(x=>x.toLowerCase()===label.toLowerCase());
        if(idx>=0) films.splice(idx,1); else films.push(label);
        render(); sync();
      };
      sync();
      acts.append(kp, lb, add); card.appendChild(acts); box.appendChild(card);
    });
    log().appendChild(box); scrollDown();
  }
  function endButtons(ok){
    const c = controls(); c.innerHTML='';
    if(ok){
      const all = document.createElement('button'); all.className='btn primary'; all.textContent=T('allToWheel');
      all.onclick = () => {
        lastRecs.forEach(f=>{ const l = filmLabel(f); if(!films.some(x=>x.toLowerCase()===l.toLowerCase())) films.push(l); });
        render(); showTab('wheel'); setTimeout(spin, 500);
      };
      const more = document.createElement('button'); more.className='btn'; more.textContent=T('more'); more.onclick=()=>recommend(true);
      c.append(all, more);
    }
    const st = document.createElement('button'); st.className='btn ghost'; st.textContent=T('restart'); st.onclick=startQuiz; c.appendChild(st);
  }

  document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{ if(lang===b.dataset.lang) return; lang=b.dataset.lang; applyLang(); render(); if(current && !rolling){ $('pickRank').textContent=T('place')(current[0]); $('pickSrc').textContent=T('srcLabel'); syncPickAdd(); } if(quizStarted){ if(tab==='quiz') startQuiz(); else quizStarted=false; } });
  window.addEventListener('resize', resize);
  applyLang();
  render();
  resize();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
})();
</script>
</body>
</html>
